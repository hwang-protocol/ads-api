# 依赖自动升级：Action 的 SHA、npm 包、Docker 基础镜像都会定期提 PR，PR 照样要过整条流水线
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /ads-api/infra
    schedule: { interval: weekly }
    groups:
      cdk: { patterns: ['aws-cdk*', 'constructs'] }
  - package-ecosystem: docker
    directory: /ads-api/docker
    schedule: { interval: weekly }
